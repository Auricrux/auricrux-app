services:
  ollama:
    image: ollama/ollama:latest
    container_name: auricrux-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./auricrux/system:/auricrux-system:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # DEV FALLBACK ONLY (UNSAFE-06 / ZG-M03).
  # Pulls llama3.2:3b and creates an alias Modelfile tag — NOT the product merged-LoRA GGUF path.
  # Prod / GCE must use GCS mint/load for auricrux-fca. Do not run this profile against a host
  # that already serves auricrux-fca-*-Q8_0.gguf (would clobber the product tag).
  # Enable explicitly: docker compose --profile dev-fallback up ollama-model-init
  ollama-model-init:
    profiles: ["dev-fallback"]
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ./auricrux/system:/auricrux-system:ro
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "DEV FALLBACK ONLY — not product GGUF cutover";
        echo "Pulling base model llama3.2:3b ...";
        ollama pull llama3.2:3b;
        echo "Creating auricrux-fca alias from Modelfile (dev fallback) ...";
        ollama create auricrux-fca -f /auricrux-system/Modelfile.auricrux-fca;
        echo "auricrux-fca ready (dev fallback):";
        ollama list;
    restart: "no"

  auricrux-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auricrux-web
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8080:80"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      Auricrux__OllamaUrl: "http://ollama:11434"
      Auricrux__PrimaryModel: "auricrux-fca"
      Auricrux__SecondaryModel: "llama3.2"
    volumes:
      - auricrux-data:/app/Data

volumes:
  ollama-data:
  auricrux-data:
