name: GCP VM Fix Auricrux Ollama

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      ZONE: us-central1-b
      INSTANCE: instance-20260715-113528
      PROJECT: auricrux-mobile-prod
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Recreate with Ollama URL + vision model
        run: |
          set -euo pipefail
          echo "CLOUDSDK_CORE_PROJECT=auricrux-mobile-prod" >> "$GITHUB_ENV"
          echo "CLOUDSDK_PROJECT=auricrux-mobile-prod" >> "$GITHUB_ENV"
          echo "GCLOUD_PROJECT=auricrux-mobile-prod" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=auricrux-mobile-prod" >> "$GITHUB_ENV"
          echo "GOOGLE_CLOUD_PROJECT=auricrux-mobile-prod" >> "$GITHUB_ENV"
          gcloud config set project auricrux-mobile-prod
          cat > /tmp/fix-ollama.sh <<'REMOTE'
          #!/bin/bash
          set -euo pipefail

          # Prefer docker DNS on fca-net (ollama container has no host port publish).
          OLLAMA_URL="http://auricrux-ollama:11434"
          echo "OLLAMA_URL=$OLLAMA_URL"

          echo "=== ensure ollama on fca-net ==="
          sudo docker network connect fca-net auricrux-ollama 2>/dev/null || true
          sudo docker exec auricrux-ollama ollama list || true

          echo "=== ensure vision model (moondream; Wave 5 VisionModel may be llava or moondream) ==="
          if ! sudo docker exec auricrux-ollama ollama list | grep -Eq '^(llava|moondream)\b'; then
            echo "Pulling moondream..."
            sudo docker exec auricrux-ollama ollama pull moondream
          fi
          if sudo docker exec auricrux-ollama ollama list | grep -q '^moondream' \
            && ! sudo docker exec auricrux-ollama ollama list | grep -q '^llava'; then
            sudo docker exec auricrux-ollama ollama cp moondream llava
          fi
          sudo docker exec auricrux-ollama ollama list

          VISION_MODEL=llava
          if ! sudo docker exec auricrux-ollama ollama list | grep -q '^llava'; then
            VISION_MODEL=moondream
          fi
          echo "VISION_MODEL=$VISION_MODEL"

          recreate() {
            local NAME="$1" HOSTPORT="$2"
            NETWORK=$(sudo docker inspect "$NAME" --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
            [ -n "$NETWORK" ] || NETWORK=fca-net
            sudo docker stop "$NAME"
            sudo docker rename "$NAME" "${NAME}-prev-$(date +%s)"
            sudo docker run -d --name "$NAME" --restart unless-stopped --network "$NETWORK" \
              -p "127.0.0.1:${HOSTPORT}:80" \
              --add-host=host.docker.internal:host-gateway \
              -e ASPNETCORE_URLS=http://0.0.0.0:80 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e Auricrux__OllamaUrl="$OLLAMA_URL" \
              -e Auricrux__PrimaryModel=auricrux-fca \
              -e Auricrux__VisionModel="$VISION_MODEL" \
              auricrux-web:cutover
          }
          recreate auricrux-web 4000
          recreate auricrux-api 5001
          sleep 8
          echo "=== local health ==="
          curl -fsS http://127.0.0.1:5001/health; echo
          curl -fsS -m 20 -o /tmp/vision.json -w "vision=%{http_code}\n" \
            -H 'Content-Type: application/json' \
            -d '{"imageBase64":"iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==","prompt":"Scaffold safety","focus":"safety"}' \
            http://127.0.0.1:5001/api/vision || true
          head -c 500 /tmp/vision.json; echo
          curl -fsS https://auricrux.futurecontractorsofamerica.com/health || true; echo
          sudo docker ps --filter name=auricrux --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
          REMOTE
          gcloud compute scp /tmp/fix-ollama.sh "${INSTANCE}:/tmp/fix-ollama.sh" \
            --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet
          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet \
            --command='bash /tmp/fix-ollama.sh'
