name: Android Release Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-*'

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install MAUI workload
        run: |
          dotnet workload install maui
          dotnet workload list

      - name: Publish APK
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/android | Out-Null
          dotnet publish Auricrux.Mobile/Auricrux.Mobile.csproj `
            -c Release `
            -f net8.0-android `
            -p:AndroidPackageFormat=apk `
            -p:AcceptAndroidSDKLicenses=true `
            -p:CheckEolTargetFramework=false `
            -p:CheckEolWorkloads=false `
            -o artifacts/android
          $apks = Get-ChildItem -Recurse artifacts/android -Filter *.apk
          if (-not $apks) { throw "No APK produced" }
          $apks | ForEach-Object { Write-Host $_.FullName; Write-Host ("SizeBytes=" + $_.Length) }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auricrux-android-apk
          path: artifacts/android/**/*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('android-launch-{0}', github.run_number) }}
          name: Auricrux Android ${{ github.ref_type == 'tag' && github.ref_name || format('launch-{0}', github.run_number) }}
          body: |
            Downloadable Auricrux Construction Specialist Android build (APK).
            Proprietary/local model path; no OpenAI runtime dependency.
          files: artifacts/android/**/*.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
