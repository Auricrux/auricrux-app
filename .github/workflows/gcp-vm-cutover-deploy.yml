name: GCP VM Cutover Deploy

# Production VM: auricrux-mobile-prod / instance-20260715-113528 / 35.239.225.224
on:
  workflow_dispatch:
    inputs:
      step:
        description: "inspect | deploy-auricrux | deploy-ecosystem-api"
        required: true
        default: "inspect"

jobs:
  vm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDSDK_CORE_PROJECT: auricrux-mobile-prod
      CLOUDSDK_PROJECT: auricrux-mobile-prod
      GCLOUD_PROJECT: auricrux-mobile-prod
      GCP_PROJECT: auricrux-mobile-prod
      GOOGLE_CLOUD_PROJECT: auricrux-mobile-prod
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure SSH key
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.ssh/google_compute_engine" ]; then
            ssh-keygen -t rsa -f "$HOME/.ssh/google_compute_engine" -N "" -C "github-cutover"
          fi

      - name: Inspect VM runtime
        if: inputs.step == 'inspect'
        run: |
          set -euo pipefail
          PROJECT=auricrux-mobile-prod
          ZONE=us-central1-b
          INSTANCE=instance-20260715-113528
          gcloud config set project "$PROJECT"
          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet --command='
            set -e
            echo HOST=$(hostname)
            echo USER=$(whoami)
            uname -a
            echo "=== docker ==="
            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}" || true
            echo "=== listeners ==="
            sudo ss -tlnp | head -40 || true
            echo "=== nginx ==="
            ls /etc/nginx/sites-enabled 2>/dev/null || ls /etc/nginx/conf.d 2>/dev/null || true
            sudo nginx -T 2>/dev/null | head -120 || true
            echo "=== systemd auricrux/fca ==="
            systemctl list-units --type=service --all | grep -Ei "auricrux|fca|kestrel|nginx|docker" || true
            echo "=== disk/mem ==="
            df -h / /var 2>/dev/null || df -h /
            free -m
          '

      - name: Deploy Auricrux (docker on VM)
        if: inputs.step == 'deploy-auricrux'
        run: |
          set -euo pipefail
          PROJECT=auricrux-mobile-prod
          ZONE=us-central1-b
          INSTANCE=instance-20260715-113528
          gcloud config set project "$PROJECT"

          # Pack context (exclude heavy/unneeded)
          tar --exclude='.git' --exclude='_publish' --exclude='artifacts' --exclude='**/bin' --exclude='**/obj' \
            -czf /tmp/auricrux-src.tgz .

          gcloud compute scp /tmp/auricrux-src.tgz "${INSTANCE}:/tmp/auricrux-src.tgz" \
            --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet

          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet --command='
            set -euo pipefail
            sudo mkdir -p /opt/auricrux-app
            sudo tar -xzf /tmp/auricrux-src.tgz -C /opt/auricrux-app
            cd /opt/auricrux-app
            sudo docker build -t auricrux-web:cutover -f Dockerfile .
            sudo docker rm -f auricrux-web-cutover 2>/dev/null || true
            # Publish on 5080 locally; nginx/host routing may already map auricrux host — inspect bind next.
            sudo docker run -d --name auricrux-web-cutover --restart unless-stopped \
              -p 127.0.0.1:5080:80 \
              -e ASPNETCORE_URLS=http://0.0.0.0:80 \
              -e ASPNETCORE_ENVIRONMENT=Production \
              -e Auricrux__OllamaUrl=http://host.docker.internal:11434 \
              -e Auricrux__PrimaryModel=auricrux-fca \
              --add-host=host.docker.internal:host-gateway \
              auricrux-web:cutover
            sleep 5
            curl -fsS http://127.0.0.1:5080/health || true
            curl -fsS http://127.0.0.1:5080/api/capabilities | head -c 300 || true
            sudo docker ps --filter name=auricrux-web-cutover
          '
