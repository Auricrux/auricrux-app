name: GCP Cutover Build Ecosystem API

# Builds current Auricrux/fca-ecosystem API, pushes to Artifact Registry (auricrux-mobile-prod/fca),
# then recreates fca-api on the production VM behind Caddy (api.* → :5000).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "checkout-probe | build-push | swap-vm | full"
        required: true
        default: "full"

jobs:
  cutover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDSDK_CORE_PROJECT: auricrux-mobile-prod
      CLOUDSDK_PROJECT: auricrux-mobile-prod
      GCLOUD_PROJECT: auricrux-mobile-prod
      GCP_PROJECT: auricrux-mobile-prod
      GOOGLE_CLOUD_PROJECT: auricrux-mobile-prod
      REGION: us-central1
      AR_IMAGE: us-central1-docker.pkg.dev/auricrux-mobile-prod/fca/fca-ecosystem-api:latest
      ZONE: us-central1-b
      INSTANCE: instance-20260715-113528
    steps:
      - name: Checkout auricrux-app
        uses: actions/checkout@v4

      - name: Checkout fca-ecosystem via deploy key
        uses: actions/checkout@v4
        with:
          repository: Auricrux/fca-ecosystem
          path: fca-ecosystem
          ssh-key: ${{ secrets.FCA_ECOSYSTEM_DEPLOY_KEY }}

      - name: Auth GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Checkout probe result
        if: inputs.action == 'checkout-probe'
        run: |
          set -euo pipefail
          test -f fca-ecosystem/infra/docker/Dockerfile.api
          echo "CHECKOUT_OK"
          ls fca-ecosystem/infra/docker
          git -C fca-ecosystem rev-parse --short HEAD

      - name: Cloud Build + push API image
        if: inputs.action == 'build-push' || inputs.action == 'full'
        run: |
          set -euo pipefail
          gcloud config set project auricrux-mobile-prod
          gcloud artifacts repositories describe fca --location="$REGION" --project=auricrux-mobile-prod \
            || gcloud artifacts repositories create fca --repository-format=docker --location="$REGION" --project=auricrux-mobile-prod

          cat > /tmp/cloudbuild.api.yaml <<'EOF'
          steps:
            - name: gcr.io/cloud-builders/docker
              args: ['build', '-t', 'us-central1-docker.pkg.dev/auricrux-mobile-prod/fca/fca-ecosystem-api:latest', '-f', 'infra/docker/Dockerfile.api', '.']
          images:
            - us-central1-docker.pkg.dev/auricrux-mobile-prod/fca/fca-ecosystem-api:latest
          timeout: 2400s
          options:
            machineType: E2_HIGHCPU_8
          EOF
          # Strip leading spaces introduced by YAML block indent
          sed -i 's/^          //' /tmp/cloudbuild.api.yaml
          cat /tmp/cloudbuild.api.yaml

          gcloud builds submit fca-ecosystem \
            --project=auricrux-mobile-prod \
            --config=/tmp/cloudbuild.api.yaml
          echo "Pushed $AR_IMAGE"

      - name: Swap fca-api on VM
        if: inputs.action == 'swap-vm' || inputs.action == 'full'
        run: |
          set -euo pipefail
          PROJECT=auricrux-mobile-prod
          gcloud config set project "$PROJECT"
          # Write remote script to avoid quoting hell
          cat > /tmp/swap-fca-api.sh <<EOF
          #!/bin/bash
          set -euo pipefail
          IMAGE="${AR_IMAGE}"
          echo "=== before ==="
          sudo docker ps --filter name=fca-api --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          TOKEN=\$(curl -fsS -H 'Metadata-Flavor: Google' 'http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          echo "\$TOKEN" | sudo docker login -u oauth2accesstoken --password-stdin us-central1-docker.pkg.dev
          sudo docker pull "\$IMAGE"
          sudo docker inspect fca-api --format '{{range .Config.Env}}{{println .}}{{end}}' | sudo tee /tmp/fca-api.env >/dev/null
          NETWORK=\$(sudo docker inspect fca-api --format '{{range \$k,\$v := .NetworkSettings.Networks}}{{\$k}}{{end}}' || true)
          echo "NETWORK=\$NETWORK"
          sudo docker stop fca-api || true
          sudo docker rename fca-api "fca-api-prev-\$(date +%s)" || true
          ENV_ARGS=()
          while IFS= read -r line; do
            [ -n "\$line" ] || continue
            ENV_ARGS+=(-e "\$line")
          done < /tmp/fca-api.env
          if [ -n "\$NETWORK" ]; then
            sudo docker run -d --name fca-api --restart unless-stopped --network "\$NETWORK" -p 5000:5000 "\${ENV_ARGS[@]}" "\$IMAGE"
          else
            sudo docker run -d --name fca-api --restart unless-stopped -p 5000:5000 "\${ENV_ARGS[@]}" "\$IMAGE"
          fi
          sleep 15
          echo "=== after ==="
          sudo docker ps --filter name=fca-api --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          curl -fsS http://127.0.0.1:5000/api/health || true; echo
          curl -fsS -w "catalog_http=%{http_code}\n" http://127.0.0.1:5000/api/catalog || true; echo
          curl -k -fsS -w "caddy_catalog_http=%{http_code}\n" -H 'Host: api.futurecontractorsofamerica.com' https://127.0.0.1/api/catalog || true; echo
          sudo docker logs fca-api --tail 60 2>&1 || true
          EOF
          sed -i 's/^          //' /tmp/swap-fca-api.sh
          gcloud compute scp /tmp/swap-fca-api.sh "${INSTANCE}:/tmp/swap-fca-api.sh" \
            --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet
          gcloud compute ssh "$INSTANCE" --zone="$ZONE" --project="$PROJECT" --tunnel-through-iap --quiet \
            --command='bash /tmp/swap-fca-api.sh'
